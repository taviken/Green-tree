name: Publish Python Package

on:
  release:
    types: [published]

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org
    permissions:
      # CRITICAL: This permission is required for Trusted Publishing
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-cache: 'pip'

      - name: Build distributions
        run: |
          pip install build
          python -m build

      - name: Publish package distributions to PyPI
        uses: pypa/publishtools/pypi-publish@release/v1